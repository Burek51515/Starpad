[package]
name = "kiro-token"
version = "0.1.0"
description = "KIRO COIN SPL Token Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kiro_token"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "~1.16.0"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "~1.16.0"
solana-sdk = "~1.16.0"
